name: ci

# Quality gates for every pull request and every push to develop/main.
#
#   lint, typecheck, unit tests (with coverage thresholds), python tests,
#   production build, Playwright E2E against the dev stack, and the Docker
#   image -> Concordia cross-service E2E (Ordinus -> Themis contract).
#
# `ci-success` depends on every gate, so branch protection only needs to
# require that one check. Publishing to GHCR/Docker Hub runs on push to main
# only, after every gate has passed.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Matches the runtime in infra/Dockerfile.
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails if coverage drops below the thresholds in app/vitest.config.ts
      - run: npm run test:coverage --workspace=app
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs app/coverage/coverage-summary.json "App" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-app
          path: app/coverage/
          retention-days: 7

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails if coverage drops below the thresholds in server/vitest.config.ts
      - run: npm run test:coverage --workspace=server
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs server/coverage/coverage-summary.json "Server" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-server
          path: server/coverage/
          retention-days: 7

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/library-builder/requirements.txt
      - run: pip install -r tools/library-builder/requirements.txt pytest
      - run: npm run test:py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        # apt mirrors occasionally hang; fail fast instead of eating the job timeout.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      # The API dev server resolves @gridfinity/shared from its built dist.
      - run: npm run build --workspace=shared
      # Playwright starts the Vite dev server and the API (test mode, in-memory DB).
      - run: npm run test:e2e
        env:
          CI: "true"
          # Optional dedicated test secret; absent on fork PRs, Playwright
          # generates a random password for its disposable local database.
          ORDINUS_E2E_ADMIN_PASSWORD: ${{ secrets.ORDINUS_E2E_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built but not pushed: the e2e job loads it from this artifact, so a
      # pull request is tested against its own image without publishing.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: ordinus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save ordinus:ci -o /tmp/ordinus-ci.tar

      - uses: actions/upload-artifact@v7
        with:
          name: ordinus-ci-image
          path: /tmp/ordinus-ci.tar
          retention-days: 1

  # The Ordinus -> Themis edge: runs Concordia's `push` profile (mock-laminus +
  # mock-spoolman + themis + ordinus) against this change's image, proving it
  # still satisfies the Themis operations Ordinus calls
  # (see themis/scripts/ordinus_contract.py).
  e2e-push:
    needs: [image]
    permissions:
      contents: read
      packages: read
    uses: mgomezdev/concordia/.github/workflows/e2e.yml@main
    with:
      profile: push
      image_artifact: ordinus-ci-image
      ordinus_image: ordinus:ci
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Single required check for branch protection.
  ci-success:
    if: always()
    needs: [lint, typecheck, test-app, test-server, test-python, build, e2e, image, e2e-push]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  publish:
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dual-push during the migration so anything still pulling from Docker
      # Hub keeps working unchanged while CI moves to GHCR.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/mgomezdev/gridfinity-customizer
            ninjabuffalo/gridfinity-customizer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
